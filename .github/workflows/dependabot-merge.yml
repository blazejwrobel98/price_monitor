# Merge po zielonym CI: `gh pr merge --auto` czeka na wymagane checki (Integracja).
# `pull_request_target` — nie odpala się przy pushu na main (w przeciwieństwie do
# samego `workflow_run`, który potrafi wysyłać powiadomienia przy każdym CI).
# Nie checkoutujemy HEAD PR (tylko API gh) — bezpieczny wzorzec dla PR z zewnątrz.
name: Scalanie Dependabot

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  workflows: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/')
    steps:
      - name: Squash merge po zielonych checkach
        env:
          TOKEN_PAT: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
          TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN_PAT}" ]; then
            export GH_TOKEN="${TOKEN_PAT}"
            echo "::notice::Scalanie: użyto secretu DEPENDABOT_MERGE_TOKEN."
          else
            export GH_TOKEN="${TOKEN_GITHUB}"
            echo "::notice::Scalanie: użyto GITHUB_TOKEN (PR zmieniające workflow mogą wymagać PAT — README)."
          fi
          gh pr merge "${PR_NUMBER}" --squash --auto --repo "${{ github.repository }}"
