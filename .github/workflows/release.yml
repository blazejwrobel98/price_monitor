name: Wydanie

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Nazwa obrazu (małe litery pod GHCR)
        run: |
          echo "DOCKER_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Konfiguracja Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Logowanie do GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadane obrazu Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Budowanie i publikacja obrazu
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7

      - name: Utwórz GitHub Release dla tagu
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Obraz Docker jest w **GitHub Container Registry** (`ghcr.io`) z tagiem semver z tego wydania oraz tagiem **`latest`**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
