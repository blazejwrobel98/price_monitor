[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-monitor"
version = "0.0.1"
description = "Self-hosted product price monitor with history"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Price Monitor contributors" }]
dependencies = [
    "alembic>=1.14.0",
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.9",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
price-monitor = "price_monitor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["price_monitor"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "alembic"
"alembic.ini" = "alembic.ini"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
